# Zero-shot (no SFT) open-vljepa baseline eval on VSI-Bench / MMSI-Bench.
# ──────────────────────────────────────────────────────────────────────────────
# Loads open-vljepa's own pretrained checkpoint + model classes directly (not
# fusion_gv/FusionGVJEPA) -- see openvl/infer_bench.py. Purpose: measure how
# much (if any) the fusion_gv SFT runs actually improved over the raw
# open-vljepa checkpoint, on the exact same benchmarks. V-JEPA2 already
# accepts a variable number of frames natively -- no architecture changes
# needed to feed it multi-image manifests.
#
# Get a checkpoint (same file used for fusion_gv's init_vljepa_ckpt warm-start):
#   bash dataset/download_open_vljepa_ckpt.sh
#
# Run:
#   python openvl/infer_bench.py --config openvl/configs/zeroshot_infer.yaml --config-section vsi_inference
#   python openvl/infer_bench.py --config openvl/configs/zeroshot_infer.yaml --config-section mmsi_inference
# ──────────────────────────────────────────────────────────────────────────────

checkpoint: ./ckpts/open_vljepa/best.pt

# Data-side params only -- model architecture (encoder/predictor/y_encoder
# dims) comes from inside the checkpoint itself (ckpt["config"], see
# scripts/eval.py in ../open-vljepa), not duplicated here.
image_size:    256   # facebook/vjepa2-vitl-fpc64-256's native input size
max_query_len: 64
max_target_len: 64

# embedding_metrics_lib.py metrics (held-out InfoNCE / alignment / uniformity /
# AUC / per-sample margin) -- see openvl/infer_bench.py::encode_targets.
# temperature only scales the reported InfoNCE loss, doesn't need to match
# whatever open-vljepa was originally trained with. max_samples caps how many
# rows feed the O(n^2) pairwise similarity matrix on large manifests (null =
# use every row); the subset is a random.Random(seed).sample(...) over dataset
# indices (see run_eval's embedding_metrics_indices), same sampling
# evals/embedding_metrics.py's --num-samples/--seed use on its manifest --
# keep seed and max_samples equal across both scripts' configs so the two
# runs' InfoNCE/AUC/margin numbers are comparable.
embedding_metrics_temperature: 0.07
embedding_metrics_max_samples: 2000
embedding_metrics_seed: 0


# ── VSI-Bench ──────────────────────────────────────────────────────────────────
vsi_inference:
  manifest: ./data/vsibench_manifest.jsonl
  output_dir: ./outputs/inference/openvl_zeroshot/vsibench
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── MMSI-Bench ─────────────────────────────────────────────────────────────────
mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/openvl_zeroshot/mmsibench
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16
