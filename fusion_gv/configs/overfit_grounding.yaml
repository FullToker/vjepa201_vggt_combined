# ──────────────────────────────────────────────────────────────────────────────
# Overfit sanity check — grounding mixed (SPAR + EmbodiedScan)
#
# Verifies model + grounding head + suppression loss + mlflow all work
# on a frozen mini-batch before committing to a full run.
#
# Run:
#   python fusion_gv/train_gvjepa.py \
#       --config fusion_gv/configs/overfit_grounding.yaml \
#       --overfit \
#       --overfit-samples 32 \
#       --overfit-steps 200
#
# Expect: loss drops visibly within ~50 steps.
# ──────────────────────────────────────────────────────────────────────────────


# ── Encoders ───────────────────────────────────────────────────────────────────
fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null
  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt
  vggt_img_size:    518
  vggt_patch_size:  14
  vggt_embed_dim:   1024
  vggt_out_dim:     2048
  vggt_num_patches: 1369
  jepa_img_size:    384
  jepa_patch_size:  16
  jepa_embed_dim:   1024
  jepa_num_patches: 576
  proj_dim: 1024


# ── Model ──────────────────────────────────────────────────────────────────────
model:
  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1
  query_model_name:  meta-llama/Llama-3.2-1B
  max_query_tokens:  256
  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim:  1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ./ckpts


# ── Grounding head ─────────────────────────────────────────────────────────────
grounding:
  enabled:                 true
  num_layers:              3
  num_heads:               8
  ffn_mult:                4
  dropout:                 0.0
  patch_grid:              37
  loss_weight:             0.1
  focal_alpha:             2.0   # CenterNet modified focal loss (Zhou et al. 2019)
  focal_beta:              4.0
  batch_ratio:             2    # more frequent grounding for faster validation


# ── Data ───────────────────────────────────────────────────────────────────────
data:
  spar_manifests:
    - ./data/spar_sftqa_train.jsonl
  grounding_manifests:
    - ./data/embodiedscan_train.jsonl
  num_frames:         8
  num_workers:        4
  pin_memory:         true
  persistent_workers: false
  prefetch_factor:    2


# ── Training ───────────────────────────────────────────────────────────────────
train:
  seed:      42
  device:    cuda
  precision: bf16
  output_dir: ./outputs/overfit_grounding_2data

  batch_size:                  32
  gradient_accumulation_steps: 1

  max_steps:      200    # overridden by --overfit-steps
  clip_grad_norm: 1.0
  log_every:      10
  save_every:     0

  learning_rate: 1.0e-4  # higher than prod → faster overfit signal
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8
  scheduler:     constant
  temperature:   0.07


# ── MLflow (local file store) ──────────────────────────────────────────────────
mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_overfit
  run_name: null
  log_params: true
  tags:
    project: vljepa-fusion-gv
    mode: overfit
