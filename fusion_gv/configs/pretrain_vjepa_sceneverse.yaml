# ──────────────────────────────────────────────────────────────────────────────
# Stage 1 · scene-level language pretraining · single X-encoder (V-JEPA), no VGGT
# ──────────────────────────────────────────────────────────────────────────────
#
# Unordered multi-view set -> scene description, on ScanNet + 3RScan:
#   8 views of one scan, each encoded independently by the frozen V-JEPA, the view
#   order shuffled before the predictor (model.frame_shuffle_prob), trained with InfoNCE
#   against the scene caption's embedding (query is empty: no QA at this stage).
# Rows with the same group_id (same room, incl. rescans) are masked out of each other's
# negatives -- see bidirectional_infonce.
#
# Stage 2 is sft_pretrain_vjepa_sceneverse.yaml, which warm-starts from this run's final.pt.
# Its fusion/model sections must stay identical to this file's (the load is strict),
# except the two frame_shuffle_* knobs, which have no weights.
#
# Data: sbatch dataset/convert_sceneverse_pretrain.sbatch
# Overfit check first: sbatch fusion_gv/trainbatch/overfit_pretrain_vjepa_sceneverse_sft.sbatch
# Run: sbatch fusion_gv/trainbatch/pretrain_vjepa_sceneverse.sbatch
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


fusion:
  x_encoder_type: vjepa
  x_encoder_output_dim: null

  vggt_ckpt: ./ckpts/vggt.pt        # unused under x_encoder_type=vjepa, kept so the section matches the baselines
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576
  proj_dim: 1024


model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts

  # Stage-1 input shuffle. eval prob 1.0 so the periodic val loss sees the same
  # shuffled inputs as training (val runs in eval mode, which reads the eval knob).
  frame_shuffle_prob: 1.0
  frame_shuffle_eval_prob: 1.0


data:
  train_manifests:
    - ./data/sceneverse_scene_pretrain_train.jsonl
  val_manifests:
    - ./data/sceneverse_scene_pretrain_val.jsonl   # held out by space, not by scan
  num_frames: 8
  num_workers: 2
  val_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


train:
  seed:    42
  device:  cuda
  precision: bf16

  output_dir: ./outputs/pretrain_vjepa_sceneverse

  # 3 GPUs, global batch 384 (each rank's InfoNCE sees its own 128). The train manifest
  # is ~22k rows (~2.7k scans x 8 frame sets), so ~57 steps per epoch and max_steps 600
  # is ~10 epochs -- a starting point, not tuned: watch the val loss (every 100 steps)
  # and, if it turns up, point stage 2 at an earlier step_*.pt instead of final.pt.
  batch_size:                   128
  gradient_accumulation_steps:  1
  max_steps: 600

  log_every:  20
  save_every: 300      # a checkpoint (weights + Adam state) is ~10+ GB, keep this sparse
  val_every: 100
  val_max_batches: 4

  # First guess: above the SFT stage's 1e-5 because this stage has to move frame_embed /
  # modality_embed (random init, absent from open-vljepa) and adapt to a new text domain.
  learning_rate: 2.0e-5
  min_lr:        1.0e-6
  clip_grad_norm: 1.0
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8
  scheduler:   cosine
  temperature: 0.07


mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: pretrain_vjepa_sceneverse_sft
  run_name: pretrain_vjepa_sceneverse
  log_params: true
  tags:
    project: vljepa-fusion-gv
    variant: pretrain_vjepa_sceneverse
