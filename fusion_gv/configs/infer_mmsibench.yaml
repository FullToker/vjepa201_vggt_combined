# FusionGVJEPA · MMSI-Bench inference (candidate cosine-sim accuracy + grounding save)
# Mirrors infer_vsibench_mixedsft_8select.yaml's fusion/model/grounding sections
# so the rebuilt model architecture matches a grounding-head checkpoint.
# Unlike VSI-Bench, MMSI-Bench rows have a variable image count (2-10, mostly
# 2) -- infer_mmsibench.py buckets same-count rows into batches instead of
# assuming a fixed frame count.

fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null
  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt
  vggt_img_size:    518
  vggt_patch_size:  14
  vggt_embed_dim:   1024
  vggt_out_dim:     2048
  vggt_num_patches: 1369
  jepa_img_size:    384
  jepa_patch_size:  16
  jepa_embed_dim:   1024
  jepa_num_patches: 576
  proj_dim: 1024

model:
  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1
  query_model_name:  meta-llama/Llama-3.2-1B
  max_query_tokens:  256
  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim:  1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ./ckpts

grounding:
  enabled:     true
  num_layers:  3
  num_heads:   8
  ffn_mult:    4
  dropout:     0.0
  patch_grid:  37

# Used only when --checkpoint is omitted. If this is a directory, the latest
# step_*.pt is used automatically.
train:
  output_dir: null   # TODO: fill in grounding checkpoint dir once training is done
  device: cuda
  precision: bf16

inference:
  # Manifest points at dataset/extract_mmsibench_images.py + dataset/
  # make_mmsibench_manifest.py output -- variable-length `images` list per
  # sample (2-10), bucketed by num_images at batch-build time.
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/mmsibench

  checkpoint: ./outputs/sft_grounding_mixed/step_0065000.pt   # null -> use train.output_dir latest step_*.pt

  mode: auto              # auto, select, multichoices
  save_grounding: true    # write heatmap.npy + per-frame overlay_{k}.jpg
  heatmap_alpha: 0.35      # overlay opacity, lower = more transparent

  batch_size: 8            # max rows per bucket-batch (last chunk per bucket may be smaller)
  num_workers: 8
  prefetch_factor: 4
  device: cuda
  precision: bf16
