# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA · SFT + Grounding · mixed SPAR + EmbodiedScan
#
# Loss routing (automatic, based on batch "boxes" field):
#   SPAR rows     (boxes=None) → InfoNCE only
#   EmbodiedScan  (boxes=[...]) → InfoNCE + grounding_loss_weight × CenterNet-style focal loss
#
# Run (normal):
#   python fusion_gv/train_gvjepa.py --config fusion_gv/configs/sft_grounding_mixed.yaml
#
# Run (overfit sanity check, 128 samples × 200 steps):
#   python fusion_gv/train_gvjepa.py --config fusion_gv/configs/sft_grounding_mixed.yaml --overfit
# ──────────────────────────────────────────────────────────────────────────────


# ── Frozen visual encoders + concat fusion ────────────────────────────────────
fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null
  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt
  vggt_img_size:    518
  vggt_patch_size:  14
  vggt_embed_dim:   1024
  vggt_out_dim:     2048
  vggt_num_patches: 1369
  jepa_img_size:    384
  jepa_patch_size:  16
  jepa_embed_dim:   1024
  jepa_num_patches: 576
  proj_dim: 1024


# ── Predictor + projection heads ──────────────────────────────────────────────
model:
  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1
  query_model_name:  meta-llama/Llama-3.2-1B
  max_query_tokens:  256
  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256
  shared_embed_dim:  1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ./ckpts


# ── Grounding head ────────────────────────────────────────────────────────────
grounding:
  enabled:     true
  num_layers:  3
  num_heads:   8
  ffn_mult:    4
  dropout:     0.0
  patch_grid:  37        # 518 / 14 = 37
  loss_weight: 0.1        # grounding focal-loss contribution to total loss
                           # NOTE: scale changed vs the old BCE — CenterNet-style
                           # focal loss starts much larger (per-batch normalized
                           # by positive-point count, not per-pixel mean); re-sweep
                           # this before trusting 0.1 carries over.
  focal_alpha: 2.0         # CenterNet modified focal loss (Zhou et al. 2019)
  focal_beta:  4.0         # higher = softer penalty near box center
  batch_ratio: 5           # 1 grounding batch per 5 SPAR batches


# ── Dataset (alternating: SPAR SFT ↔ EmbodiedScan grounding) ─────────────────
data:
  # SPAR: InfoNCE only (no boxes)
  spar_manifests:
    - ./data/spar_sftqa_train.jsonl
  # EmbodiedScan: grounding BCE only (boxes present, InfoNCE skipped)
  grounding_manifests:
    - ./data/embodiedscan_train.jsonl
  grounding_num_frames: 8   # EmbodiedScan groups are 8-view; rows with <8 get dropped
  num_workers:        4
  pin_memory:         true
  persistent_workers: true
  prefetch_factor:    2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:      42
  device:    cuda
  precision: bf16
  output_dir: ./outputs/sft_grounding_mixed

  batch_size:                  36
  grounding_batch_size:        18    # grounding uses S=8 (2x SPAR's S=4) → smaller batch to keep peak VRAM safe
  gradient_accumulation_steps: 4     # effective batch = 144 (SPAR path)

  max_steps:     65000    # scaled up: batch_size 32→24 (×0.75) → steps up to keep total samples seen
  clip_grad_norm: 1.0
  log_every:     50
  save_every:    6500

  learning_rate: 5.0e-5
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8
  scheduler:     cosine
  temperature:   0.07


# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_grounding
  run_name: null
  log_params: true
  tags:
    project: vljepa-fusion-gv
    mode: grounding_mixed
