# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA  ·  overfit sanity check  ·  warm-started from open-vljepa
# ·  ijepa-only encoder (1280-d, image-pretrained ablation)
# ──────────────────────────────────────────────────────────────────────────────
#
# Self-contained sibling of sft_from_vljepa_ckpt_ijepa.yaml, used ONLY by
# trainbatch/overfit_sft_from_vljepa_ckpt_ijepa.sbatch. Same fusion/model/data/
# init_vljepa_ckpt as the real run, but its own train.output_dir and its own
# vsi_inference/mmsi_inference output_dirs -- so a --overfit run (freeze one
# batch, repeat it, check loss drops + no OOM/crash end-to-end through infer)
# can never collide with or overwrite the real run's checkpoint or eval
# outputs. Matches overfit_from_vljepa_ckpt.yaml's structure exactly, only
# fusion.x_encoder_type differs -- see that file for the fuller rationale.
#
# Run:
#   python fusion_gv/train_gvjepa.py --config fusion_gv/configs/overfit_from_vljepa_ckpt_ijepa.yaml \
#       --overfit --overfit-samples 128 --overfit-steps 200
#   python fusion_gv/infer_vsibench.py  --config fusion_gv/configs/overfit_from_vljepa_ckpt_ijepa.yaml --config-section vsi_inference
#   python fusion_gv/infer_mmsibench.py --config fusion_gv/configs/overfit_from_vljepa_ckpt_ijepa.yaml --config-section mmsi_inference
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


# ── Frozen I-JEPA visual encoder (ablation: image-pretrained, no video) ──────
fusion:
  x_encoder_type: ijepa
  x_encoder_output_dim: null
  # x_encoder_ckpt: null   # unset -> encoder_registry default (ckpts/IN1K-vit.h.14-300e.pth.tar)

  # Unused under x_encoder_type=ijepa, but build_model_from_config requires
  # the key regardless -- harmless placeholder, same as the real run's yaml.
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_ckpt: ./ckpts/vggt.pt
  proj_dim: 1024


# ── Predictor + projection heads ──────────────────────────────────────────────
model:
  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts


# ── Dataset ───────────────────────────────────────────────────────────────────
data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:    42
  device:  cuda
  precision: bf16

  # Distinct from sft_from_vljepa_ckpt_ijepa.yaml's real output_dir -- this
  # is the whole point of this file existing separately.
  output_dir: ./outputs/sft_from_vljepa_ckpt_ijepa_overfit

  # Matches the real run's single-GPU batch_size=128 -- --overfit-samples
  # should be passed as 128 too, so per-GPU tensor shapes/memory match.
  # I-JEPA's per-frame token count (256) is smaller than V-JEPA's (576) at
  # the same K=1 pooling, so this should fit at least as easily as the vjepa
  # overfit run did -- but that's exactly the assumption this check exists
  # to confirm, not to skip.
  batch_size: 128
  gradient_accumulation_steps: 1
  # --overfit on the CLI forces max_steps/log_every/save_every from
  # --overfit-steps/hardcoded values at runtime regardless of what's here --
  # kept as a readable placeholder matching train_gvjepa.py's --overfit-steps default.
  max_steps: 200
  clip_grad_norm: 1.0
  log_every: 10
  save_every: 0

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8

  scheduler:   cosine
  temperature: 0.07


# ── Inference: VSI-Bench ──────────────────────────────────────────────────────
vsi_inference:
  manifest: ./data/vsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_ijepa_overfit/vsibench
  checkpoint: null   # -> train.output_dir above -> final.pt
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── Inference: MMSI-Bench ─────────────────────────────────────────────────────
mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_ijepa_overfit/mmsibench
  checkpoint: null
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── MLflow ────────────────────────────────────────────────────────────────────
# Off by default -- this is a sanity check, not a run worth tracking.
mlflow:
  enabled: false
