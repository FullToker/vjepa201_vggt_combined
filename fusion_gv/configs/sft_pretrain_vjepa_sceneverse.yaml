# ──────────────────────────────────────────────────────────────────────────────
# Stage 2 · SPAR SFT · warm-started from the stage-1 checkpoint · V-JEPA only
# ──────────────────────────────────────────────────────────────────────────────
#
# Identical to sft_from_vljepa_ckpt.yaml (the baseline this is compared against:
# same data, batch, steps, LR, schedule) except for where the weights come from:
# init_gvjepa_ckpt (stage 1's final.pt) instead of init_vljepa_ckpt (open-vljepa).
#
# frame_shuffle_prob stays 0.0 here, unlike stage 1: several SPAR types depend on image
# order (e.g. camera_motion_infer is the motion from the first view to the second), and
# the baseline never shuffled, so shuffling would confound the comparison.
#
# Overfit check first: sbatch fusion_gv/trainbatch/overfit_pretrain_vjepa_sceneverse_sft.sbatch
# Run: sbatch fusion_gv/trainbatch/sft_pretrain_vjepa_sceneverse.sbatch
# ──────────────────────────────────────────────────────────────────────────────

# Stage 1's final.pt (or an earlier step_*.pt if its val loss turned up). Weights only.
init_gvjepa_ckpt: ./outputs/pretrain_vjepa_sceneverse/final.pt


fusion:
  x_encoder_type: vjepa
  x_encoder_output_dim: null

  vggt_ckpt: ./ckpts/vggt.pt        # unused under x_encoder_type=vjepa, kept so the section matches the baselines
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576
  proj_dim: 1024


model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts

  # K=128 (not the default 1/mean-pool): predictor sees frames*K visual
  # tokens, so this is a real memory jump (8 -> 1024 tokens at num_frames=8),
  # not free -- batch_size/gradient_accumulation_steps below are lowered
  # accordingly. No profiling exists yet for this K at this encoder's dim;
  # the overfit run is what confirms it fits.
  visual_pool_k: 128

  # Off, see header.
  frame_shuffle_prob: 0.0
  frame_shuffle_eval_prob: 0.0


data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


train:
  seed:    42
  device:  cuda
  precision: bf16

  output_dir: ./outputs/sft_pretrain_vjepa_sceneverse

  # 2 GPUs (was 3): global batch 128 * 1 * 2 = 256; ceil(1.5 * 1,771,283 / 256) = 10,379.
  batch_size:                   128
  gradient_accumulation_steps:  1
  max_steps: 10379

  log_every:  50
  save_every: 2000

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  clip_grad_norm: 1.0
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8
  scheduler:   cosine
  temperature: 0.07



vsi_inference:
  manifest: ./data/vsibench_manifest_32f.jsonl
  output_dir: ./outputs/inference/sft_pretrain_vjepa_sceneverse/vsibench
  checkpoint: null   # -> train.output_dir -> latest step_*.pt or final.pt
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_pretrain_vjepa_sceneverse/mmsibench
  checkpoint: null
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: pretrain_vjepa_sceneverse_sft
  run_name: sft_pretrain_vjepa_sceneverse
  log_params: true
  tags:
    project: vljepa-fusion-gv
    variant: sft_pretrain_vjepa_sceneverse
