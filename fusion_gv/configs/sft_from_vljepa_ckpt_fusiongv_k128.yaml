# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA  ·  SFT stage  ·  warm-started from an open-vljepa checkpoint
# ·  fusion_gv encoder (VGGT + V-JEPA concat, 2048-d)  ·  K=128 VisualResampler
# ──────────────────────────────────────────────────────────────────────────────
#
# Sibling of sft_from_vljepa_ckpt_fusiongv.yaml with visual_pool_k: 128 --
# the empirically-found memory ceiling for batch_size=32/num_frames=8 on an
# 80GB A100 (see fusion_gv/k_sweep/ results: K=128 -> 80.4GB peak, K=256 OOM).
# Own output_dir (train + both infer sections), deliberately NOT shared with
# sft_from_vljepa_ckpt_fusiongv.yaml's -- same reasoning as the K-sweep
# profiling config: never let two different runs' checkpoints/eval outputs
# collide in one directory.
#
# Everything else (init_vljepa_ckpt, data, LR schedule, mlflow) is identical
# to sft_from_vljepa_ckpt_fusiongv.yaml -- see that file for the full
# rationale (vis_proj shape-mismatch note, effective-batch/epoch math, etc.).
#
# Run:
#   sbatch fusion_gv/trainbatch/sft_from_vljepa_ckpt_fusiongv_k128.sbatch
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


# ── Frozen visual encoders + concat fusion ────────────────────────────────────
fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null

  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14        # 518 / 14 = 37 -> 37x37 = 1369 patches
  vggt_embed_dim:      1024
  vggt_out_dim:        2048      # frame_inter || global_inter = 2 x embed_dim
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16        # 384 / 16 = 24 -> 24x24 = 576 patches
  jepa_embed_dim:      1024
  jepa_num_patches:    576

  proj_dim: 1024                 # each stream projected to this dim -> fused = 2*proj_dim = 2048


# ── Predictor + projection heads ──────────────────────────────────────────────
model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts

  # VisualResampler: K tokens/frame, replaces spatial mean-pool. 128 =
  # empirical memory ceiling at batch_size=32/num_frames=8 on 80GB A100 --
  # see fusion_gv/k_sweep/run_sweep.py results.
  visual_pool_k: 128


# ── Dataset ───────────────────────────────────────────────────────────────────
data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:    42
  device:  cuda
  precision: bf16

  # Own dir -- distinct from sft_from_vljepa_ckpt_fusiongv.yaml's
  # ./outputs/sft_from_vljepa_ckpt_fusiongv (K=1/mean-pool run).
  output_dir: ./outputs/sft_from_vljepa_ckpt_fusiongv_k128

  # batch_size halved / accum doubled vs sft_from_vljepa_ckpt_fusiongv.yaml
  # (32/4) -- K=128 sits right at the single-GPU memory ceiling (80.4GB
  # profiled, A100 usable capacity 79.15GB) with ~0 margin; real 3-GPU DDP
  # training adds its own overhead (output-tensor clone in _DDPSink, gradient
  # bucketing) on top of that per-GPU, which OOM'd by <1GB. Same effective
  # batch (16*8*3=384), so max_steps/LR/training dynamics are unchanged.
  batch_size:                   16
  gradient_accumulation_steps:  8
  # effective batch = batch_size(16) * accum(8) * 3 GPUs = 384.
  # 3 epochs over spar_sftqa_sftvljepa_uni8.jsonl (1,771,283 rows):
  #   ceil(3 * 1,771,283 / 384) = 13,839
  max_steps: 13839

  clip_grad_norm: 1.0
  log_every:  50
  save_every: 0

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8

  scheduler:   cosine
  temperature: 0.07


# ── Inference: VSI-Bench ──────────────────────────────────────────────────────
vsi_inference:
  manifest: ./data/vsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_fusiongv_k128/vsibench

  checkpoint: null   # -> train.output_dir above -> final.pt

  mode: auto
  save_grounding: false

  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── Inference: MMSI-Bench ─────────────────────────────────────────────────────
mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_fusiongv_k128/mmsibench

  checkpoint: null

  mode: auto
  save_grounding: false

  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: null
  log_params: true
  tags:
    project: vljepa-fusion-gv
    variant: warm-start-open-vljepa-fusiongv-k128
