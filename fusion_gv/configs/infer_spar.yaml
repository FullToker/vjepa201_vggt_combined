# FusionGVJEPA inference / SPAR candidate evaluation
# This mirrors the training config sections needed to rebuild the model.

fusion:
  x_encoder_type: fusion_gv       # "fusion_gv" or "vjepa"
  x_encoder_output_dim: null      # defaults: fusion_gv=3072, vjepa=1024

  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576

  fusion_type: concat
  num_levels:  4

model:
  use_fusion_level: 3

  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05
  hf_cache_dir: ./ckpts

grounding:
  enabled:     true
  num_layers:  3
  num_heads:   8
  ffn_mult:    4
  dropout:     0.0
  patch_grid:  37

# Used only when --checkpoint is omitted. If this is a directory, the latest
# step_*.pt is used automatically.
train:
  output_dir: ./outputs/sft_grounding_mixed
  device: cuda
  precision: bf16

inference:
  # SPAR eval format: {"images": [...], "query": "...", "candidates": [...], "target": "..."}
  # Both key styles kept: infer_gvjepa.py reads input_jsonl/output_jsonl/metrics_output,
  # infer_vsibench.py reads manifest/output_dir (used for the sft_grounding_mixed
  # checkpoint sanity check against SPAR's own eval set).
  input_jsonl: ./data/spar_sftqa_eva.jsonl
  manifest: ./data/spar_sftqa_eva.jsonl
  input_root: .
  output_jsonl: ./outputs/inference/spar_sftmixed/spar_predictions.jsonl
  metrics_output: ./outputs/inference/spar_sftmixed/spar_metrics.json
  output_dir: ./outputs/inference/spar_sanity_check

  # null means: use latest step_*.pt under train.output_dir.
  # Can also be a specific checkpoint path or checkpoint directory.
  checkpoint: ./outputs/sft_grounding_mixed/step_0065000.pt

  mode: auto                    # auto, embedding, select, multichoices
  save_grounding: true
  heatmap_alpha: 0.35
  # SPAR rows have fixed 4-image inputs, so batching improves GPU utilization.
  # If fusion_gv OOMs, try 4; for vjepa-only, try 16 or 32.
  batch_size: 8
  num_workers: 16
  prefetch_factor: 4
  device: cuda
  precision: bf16
