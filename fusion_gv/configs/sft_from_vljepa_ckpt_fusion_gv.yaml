# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA  ·  SFT stage  ·  warm-started from open-vljepa, VGGT+JEPA dual encoder
# ──────────────────────────────────────────────────────────────────────────────
#
# Variant of sft_from_vljepa_ckpt.yaml with fusion.x_encoder_type=fusion_gv
# (VGGT + V-JEPA2 concat) instead of vjepa-only (1024).
#
# proj_dim is set to 512 below (not the fusion_gv default 1024) specifically
# so concat output = 2*512 = 1024, shape-matching open-vljepa's vis_proj
# input. This lets load_vljepa_init.py's shape check pass and copy
# vis_proj.weight/bias instead of skipping — but the input feeding vis_proj
# is geo_proj/sem_proj(vggt/jepa) (fusion_aligned.py's fresh, randomly
# initialized LN+MLP projectors), not open-vljepa's original raw FrozenJEPA
# feature. So the copied weight is shape-valid but sees a different input
# distribution at init than it was trained for — unclear how much (if any)
# real head start this gives over random init; untested.
#
# What transfers from the open-vljepa checkpoint vs sft_from_vljepa_ckpt.yaml:
#   predictor.layers/norm  -> transfers (same Llama-3.2-1B backbone)
#   y_encoder / y_proj     -> transfers (unaffected by visual_dim)
#   vis_proj               -> transfers (shape-matched via proj_dim=512, see above)
#   geo_proj / sem_proj    -> always from scratch (fusion_gv-only modules,
#                              open-vljepa has no equivalent)
#
# Memory warning (untested on this cluster's GPUs — verify with the overfit
# sbatch before committing to a full run):
#   fusion_gv/configs/sft_vv_concat.yaml (the existing fusion_gv config) is
#   calibrated for a single H200/B200 at batch_size=32, num_frames=4, and
#   still comments "if OOM, reduce batch_size to 8". This config runs
#   num_frames=8 (2x tokens through both frozen encoders + the trainable
#   fusion module) on whatever GPU class this cluster's `geo` partition has
#   (sft_from_vljepa_ckpt.yaml's vjepa-only path already used ~66-68GB/GPU
#   at batch_size=128, num_frames=8 — nowhere near H200/B200 headroom).
#   batch_size below is a conservative *guess*, not a validated number.
#
# Get a checkpoint:
#   sbatch dataset/download_open_vljepa_ckpt.sbatch
#
# Get the training data (spar_sftqa_sftvljepa_uni8.jsonl below):
#   sbatch dataset/convert_spar_sftqa_uni8.sbatch   (already run)
#
# Run the overfit sanity check FIRST (3 GPUs, matches the full run):
#   accelerate launch --multi_gpu --num_processes 3 fusion_gv/train_gvjepa.py \
#       --config fusion_gv/configs/sft_from_vljepa_ckpt_fusion_gv.yaml \
#       --overfit --overfit-samples 16 --overfit-steps 200
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


# ── Frozen VGGT + V-JEPA visual encoders, concat fusion ──────────────────────
fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null   # defaults to 2048 (= 2 * proj_dim) for fusion_gv

  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576
  proj_dim: 512   # concat -> 1024, shape-matches open-vljepa's vis_proj (see load_vljepa_init.py)


# ── Predictor + projection heads ──────────────────────────────────────────────
model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  # Must match open-vljepa's predictor backbone for the loaded layers to be
  # meaningful — same checkpoint name, same n_keep_layers.
  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  # Must match open-vljepa's y_encoder for the loaded weights to be meaningful.
  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  # Must equal open-vljepa's proj_dim (1536) — pred_proj/y_proj shapes depend on it.
  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts


# ── Dataset ───────────────────────────────────────────────────────────────────
data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  # Same host-RAM fix as sft_from_vljepa_ckpt.yaml (16 workers x prefetch=4
  # OOM-killed a worker there) — carried over, unrelated to which encoder
  # consumes the image tensors.
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:    42
  device:  cuda
  precision: bf16

  output_dir: ./outputs/sft_from_vljepa_ckpt_fusion_gv

  # UNVALIDATED — start here, drop if the overfit sanity check OOMs.
  batch_size:                   16
  gradient_accumulation_steps:  8   # effective batch = 16 x 3 GPUs x 8 = 384

  # Hard cap at 1 epoch. accelerator.prepare(loader) shards the dataloader
  # across the 3 GPUs, so each rank only sees 1/3 the rows per epoch:
  #   ceil(1,771,283 rows / (batch_size 16 x 3 GPUs)) = 36,902 micro-batch steps
  #   = 36,902 / grad_accum(8) ~= 4,613 optimizer updates
  max_steps: 36902

  clip_grad_norm: 1.0
  log_every:  50
  save_every: 0

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8

  scheduler:   cosine
  temperature: 0.07


# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: null
  log_params: true
  tags:
    project: vljepa-fusion-gv
    variant: warm-start-open-vljepa-fusion_gv
