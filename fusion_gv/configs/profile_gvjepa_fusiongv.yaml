# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA  ·  torch.profiler run  ·  fusion_gv encoder (VGGT + V-JEPA concat)
# ──────────────────────────────────────────────────────────────────────────────
#
# Self-contained sibling of overfit_from_vljepa_ckpt_fusiongv.yaml, used ONLY
# by fusion_gv/trainbatch/profile_gvjepa.sbatch. Same fusion/model/data/
# init_vljepa_ckpt as that file, but its OWN train.output_dir and its OWN
# vsi_inference.output_dir -- deliberately NOT shared with
# overfit_from_vljepa_ckpt_fusiongv.yaml's, so a profiling run's
# profiler_trace/ never mixes with the plain overfit sanity check's, and a
# profiling run never overwrites the sanity check's checkpoint or vice versa.
# (Within THIS file's own output_dir, profile_gvjepa.sbatch does intentionally
# clear profiler_trace/ before each run -- see that script -- so repeated
# profiling runs don't accumulate stale trace files from earlier attempts.)
#
# Run:
#   sbatch fusion_gv/trainbatch/profile_gvjepa.sbatch
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


# ── Frozen visual encoders + concat fusion ────────────────────────────────────
fusion:
  x_encoder_type: fusion_gv
  x_encoder_output_dim: null

  vggt_ckpt: ./ckpts/vggt.pt
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576
  proj_dim: 1024


# ── Predictor + projection heads ──────────────────────────────────────────────
model:
  predictor_hidden_size: 1024
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts


# ── Dataset ───────────────────────────────────────────────────────────────────
data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:    42
  device:  cuda
  precision: bf16

  # Own dir -- distinct from both the real run
  # (./outputs/sft_from_vljepa_ckpt_fusiongv) and the plain overfit sanity
  # check (./outputs/sft_from_vljepa_ckpt_fusiongv_overfit). This is the
  # whole point of this file existing separately.
  output_dir: ./outputs/profile_gvjepa_fusiongv

  # Matches the real run's per-GPU batch_size=32.
  batch_size: 32
  gradient_accumulation_steps: 1
  # --overfit on the CLI forces max_steps/log_every/save_every from
  # --overfit-steps/hardcoded values at runtime regardless of what's here.
  max_steps: 200
  clip_grad_norm: 1.0
  log_every: 10
  save_every: 0

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8

  scheduler:   cosine
  temperature: 0.07


# ── Inference: VSI-Bench ──────────────────────────────────────────────────────
vsi_inference:
  manifest: ./data/vsibench_manifest.jsonl
  output_dir: ./outputs/inference/profile_gvjepa_fusiongv/vsibench
  checkpoint: null   # -> train.output_dir above -> final.pt
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── Inference: MMSI-Bench ─────────────────────────────────────────────────────
mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/profile_gvjepa_fusiongv/mmsibench
  checkpoint: null
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  enabled: false
