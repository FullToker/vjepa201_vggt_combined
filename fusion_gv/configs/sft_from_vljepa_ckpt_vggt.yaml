# ──────────────────────────────────────────────────────────────────────────────
# FusionGVJEPA  ·  SFT stage  ·  x_encoder_type=vggt ablation (3 GPUs, K=32)
# ──────────────────────────────────────────────────────────────────────────────
#
# Third arm of the X-encoder ablation, alongside sft_from_vljepa_ckpt.yaml
# (x_encoder_type=vjepa) and sft_from_vljepa_ckpt_ijepa.yaml (x_encoder_type=ijepa).
# This one has NO semantic stream at all -- pure explicit multi-view geometry
# (VGGT alone). Answers "does explicit geometric multi-view training already
# cover what a video/image-pretrained semantic encoder (or ScanNet
# pretraining) would add".
#
# 3 GPUs. InfoNCE negatives are gathered across ranks (gvjepa_trainer.py
# gather_with_grad), so each sample is scored against 64*3-1 = 191 negatives;
# on a single GPU the gather is a no-op and it is 63. Gradient accumulation
# does NOT add negatives, so it is off here (see train: section). batch_size=64
# itself is still a reasoned-but-unmeasured guess (see
# overfit_from_vljepa_ckpt_vggt.yaml) -- the overfit run is what confirms it
# fits.
#
# visual_pool_k=32 (see model: section below). Measured by
# fusion_gv/k_sweep/run_sweep_vggt_2gpu.sbatch at batch_size=64 per GPU:
# K=32 peaks at 79.5 GB, K=64 OOMs -- so 32 is the ceiling at this batch size.
#
# Caveat (does NOT need fixing, just know it's there): unlike the vjepa arm,
# open-vljepa's vis_proj (shaped for visual_dim=1024) does NOT transfer here
# either -- VGGT's visual_dim is 2048. Left at random init, same asymmetry
# the ijepa and fusion_gv arms already have. predictor.layers/norm and
# y_encoder/y_proj still transfer fine (X-encoder-independent).
#
# Get a checkpoint:
#   bash dataset/download_open_vljepa_ckpt.sh   (or sbatch dataset/download_open_vljepa_ckpt.sbatch)
#   python download_ckpts.py --models vggt        # ckpts/vggt.pt, if not already there
#
# Get the training data (spar_sftqa_sftvljepa_uni8.jsonl below):
#   sbatch dataset/convert_spar_sftqa_uni8.sbatch
#
# Run the overfit check first:
#   sbatch fusion_gv/trainbatch/overfit_sft_from_vljepa_ckpt_vggt.sbatch
# Then the real run:
#   sbatch fusion_gv/trainbatch/sft_from_vljepa_ckpt_vggt.sbatch
# ──────────────────────────────────────────────────────────────────────────────

init_vljepa_ckpt: ./ckpts/open_vljepa/best.pt


# ── Frozen VGGT visual encoder (ablation: pure geometry, no semantic stream) ─
fusion:
  x_encoder_type: vggt

  # Unused under x_encoder_type=vggt, but build_model_from_config requires
  # the key regardless -- harmless placeholder, same value as the other arms'.
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_ckpt: ./ckpts/vggt.pt
  proj_dim: 1024


# ── Predictor + projection heads ──────────────────────────────────────────────
# Identical to the vjepa/ijepa arms -- this is the whole point of the ablation.
model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts

  # K=32: predictor sees frames*K = 256 visual tokens at num_frames=8.
  # Largest K that fits at batch_size=64/GPU (K=64 OOMs) -- see header.
  visual_pool_k: 32

  # Train on 8 frames, evaluate VSI-Bench on 32: draw the 8 frame tags from all
  # 33 frame_embed rows so rows 8..32 are trained too (see GVJEPAConfig).
  frame_id_random: true


# ── Dataset ───────────────────────────────────────────────────────────────────
# Same manifest, same num_frames as the other two arms.
data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed:    42
  device:  cuda
  precision: bf16

  output_dir: ./outputs/sft_from_vljepa_ckpt_vggt_k32

  # max_steps counts BATCHES per rank (GVJEPATrainer.fit), not optimizer
  # updates: updates = max_steps / gradient_accumulation_steps, and samples
  # seen = max_steps * batch_size * num_gpus. The previous setting
  # (accum 6, max_steps 3460) was therefore 577 updates over ~0.25 epoch,
  # not the 3460 updates / 1.5 epochs its comment intended.
  #
  # 3 GPUs, accum 1: 6,920 updates, 6,920 * 64 * 3 = 1.33M samples
  # = 0.75 epoch of 1,771,283 rows -- same data coverage as the 2-GPU
  # setting it replaces (10,380 * 64 * 2). Full 1.5 epochs = 13,838.
  batch_size:                   64
  gradient_accumulation_steps:  1
  max_steps: 6920

  clip_grad_norm: 1.0
  log_every:  50
  save_every: 2000

  # High LR for everything trainable except y_encoder (resampler, vis_proj,
  # embeddings, predictor, pred_proj, y_proj). y_encoder runs at
  # learning_rate * model.y_encoder_lr_multiplier (0.05) = 5e-6.
  learning_rate: 1.0e-4
  min_lr:        1.0e-6
  warmup_steps:  500             # optimizer updates, linear 0 -> learning_rate
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8

  scheduler:   cosine
  temperature: 0.07


# ── Inference: VSI-Bench ──────────────────────────────────────────────────────
vsi_inference:
  manifest: ./data/vsibench_manifest_32f.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_vggt_k32/vsibench

  # Explicit final.pt: null would pick the latest step_*.pt over final.pt
  # (infer_gvjepa._latest_checkpoint), i.e. step 6000, not the end of training.
  checkpoint: ./outputs/sft_from_vljepa_ckpt_vggt_k32/final.pt

  mode: auto
  save_grounding: false

  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── Inference: MMSI-Bench ─────────────────────────────────────────────────────
mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_from_vljepa_ckpt_vggt_k32/mmsibench

  checkpoint: ./outputs/sft_from_vljepa_ckpt_vggt_k32/final.pt   # see vsi_inference

  mode: auto
  save_grounding: false

  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  enabled: true
  env_file: .env/mlflow.env
  tracking_uri: "file:///glob/g01-cache/pf/Yushuo/mlruns"
  experiment_name: vljepa_sft_from_ckpt
  run_name: null
  log_params: true
  tags:
    project: vljepa-fusion-gv
    variant: warm-start-open-vljepa-vggt
