# Single-GPU overfit check for stage 2 (sft_pretrain_vjepa_sceneverse.yaml).
# Warm-starts from stage 1's OVERFIT checkpoint, so the init_gvjepa_ckpt hand-off is
# exercised end to end. Needs overfit_pretrain_vjepa_sceneverse.yaml's run to have finished.
#   python fusion_gv/train_gvjepa.py --config fusion_gv/configs/overfit_sft_pretrain_vjepa_sceneverse.yaml \
#       --overfit --overfit-samples 128 --overfit-steps 200
#   python fusion_gv/infer_vsibench.py  --config <this file> --config-section vsi_inference
#   python fusion_gv/infer_mmsibench.py --config <this file> --config-section mmsi_inference

init_gvjepa_ckpt: ./outputs/pretrain_vjepa_sceneverse_overfit/final.pt


fusion:
  x_encoder_type: vjepa
  x_encoder_output_dim: null

  vggt_ckpt: ./ckpts/vggt.pt        # unused under x_encoder_type=vjepa, kept so the section matches the baselines
  jepa_ckpt: ./ckpts/vjepa2_1_vitl_dist_vitG_384.pt

  vggt_img_size:       518
  vggt_patch_size:     14
  vggt_embed_dim:      1024
  vggt_out_dim:        2048
  vggt_num_patches:    1369
  jepa_img_size:       384
  jepa_patch_size:     16
  jepa_embed_dim:      1024
  jepa_num_patches:    576
  proj_dim: 1024


model:
  predictor_hidden_size: 1024    # toy path only, ignored (llama forces h=2048)
  predictor_layers:      8
  predictor_heads:       16
  predictor_ffn_mult:    4
  predictor_dropout:     0.1

  query_model_name: meta-llama/Llama-3.2-1B
  predictor_llama_layers: 8
  max_query_tokens:  256

  y_encoder_name:    google/embeddinggemma-300m
  max_target_tokens: 256

  shared_embed_dim: 1536
  y_encoder_lr_multiplier: 0.05

  hf_cache_dir: ./ckpts

  # K=32 (not the default 1/mean-pool, and not the 128 the other ablation
  # arms use): predictor sees frames*K visual tokens (8*32=256 at num_frames=8).
  # K=128 and K=64 both OOM'd on the real 2-GPU/batch=128 run (see chat
  # history) -- K=64 missed by only 514MiB (inside attention's RoPE, not
  # even the MLP), so this should have real margin, but batch_size/accum
  # below are still UNCHANGED, so it's still unverified until the overfit
  # run actually confirms it -- run that BEFORE resubmitting the real job
  # again, two real-job OOMs in a row is enough.
  visual_pool_k: 32

  # Off, as in the real stage-2 run.
  frame_shuffle_prob: 0.0
  frame_shuffle_eval_prob: 0.0


data:
  train_manifests:
    - ./data/spar_sftqa_sftvljepa_uni8.jsonl
  num_frames: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2


train:
  seed:    42
  device:  cuda
  precision: bf16

  output_dir: ./outputs/sft_pretrain_vjepa_sceneverse_overfit

  batch_size: 64
  gradient_accumulation_steps: 1
  max_steps: 200
  log_every: 10
  save_every: 0

  learning_rate: 1.0e-5
  min_lr:        1.0e-6
  clip_grad_norm: 1.0
  weight_decay:  0.01
  adam_beta1:    0.9
  adam_beta2:    0.95
  adam_eps:      1.0e-8
  scheduler:   cosine
  temperature: 0.07



vsi_inference:
  manifest: ./data/vsibench_manifest_32f.jsonl
  output_dir: ./outputs/inference/sft_pretrain_vjepa_sceneverse_overfit/vsibench
  checkpoint: null   # -> train.output_dir -> latest step_*.pt or final.pt
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


mmsi_inference:
  manifest: ./data/mmsibench_manifest.jsonl
  output_dir: ./outputs/inference/sft_pretrain_vjepa_sceneverse_overfit/mmsibench
  checkpoint: null
  mode: auto
  save_grounding: false
  batch_size: 8
  num_workers: 8
  device: cuda
  precision: bf16


mlflow:
  enabled: false
